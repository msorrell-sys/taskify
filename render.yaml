services:
  # PostgreSQL Database
  - type: pserv
    name: taskify-db
    env: docker
    plan: free
    region: oregon

  # Backend API
  - type: web
    name: taskify-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install --cache /tmp/npm-cache && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: taskify-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health

  # Frontend
  - type: web
    name: taskify-frontend
    runtime: static
    buildCommand: cd frontend && npm install --cache /tmp/npm-cache && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
